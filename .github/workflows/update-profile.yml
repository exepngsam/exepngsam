name: Live Profile Telemetry Updater

on:
  schedule:
    # Auto-refresh telemetry every hour for live updates
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install requests pillow

      - name: Re-generate Profile SVGs & Telemetry
        run: |
          python generate_all.py

      - name: Commit and Push if Changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add header-liquid-glass.svg terminal-card.svg github-contribution-grid-snake.svg github-stats-animated.svg github-streak-cyberdeck.svg projects-animated.svg neural-core.svg info-card.svg README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(telemetry): auto-update live github profile stats & SVGs" && git push)
