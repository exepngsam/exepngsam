<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 190" width="100%" height="auto" style="max-width: 920px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SFMono-Regular', Consolas, monospace;">
  <defs>
    <!-- Liquid Glass Dark Background -->
    <linearGradient id="streak-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151d2a" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0f1520" stop-opacity="0.97" />
      <stop offset="100%" stop-color="#090d14" stop-opacity="0.99" />
    </linearGradient>

    <!-- Liquid Glass Border Gradient -->
    <linearGradient id="streak-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa657" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#ffa657;#39d353;#00f0ff;#a855f7;#ffa657" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.85">
        <animate attributeName="stop-color" values="#00f0ff;#ffa657;#39d353;#00f0ff" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Flame Aura Radial Gradient -->
    <radialGradient id="flame-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffa657" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ff5f56" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#39d353" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#090d14" stop-opacity="0" />
    </radialGradient>

    <!-- Flame Glow Filter -->
    <filter id="flame-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b1" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Equalizer Bar Gradient -->
    <linearGradient id="eq-bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#39d353" />
      <stop offset="100%" stop-color="#ffa657" />
    </linearGradient>
  </defs>

  <style>
    .streak-title { font-size: 11.5px; font-weight: 700; fill: #7d8590; font-family: monospace; }
    .metric-val { font-size: 34px; font-weight: 900; fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, monospace; }
    .metric-sub { font-size: 11px; font-weight: 700; fill: #7d8590; letter-spacing: 0.5px; }
    .metric-date { font-size: 10px; font-weight: 600; fill: #58a6ff; font-family: monospace; }
    .eq-label { font-size: 9px; font-weight: 700; fill: #7d8590; font-family: monospace; text-anchor: middle; }
  </style>

  <!-- Outer Liquid Glass Frame -->
  <rect x="3" y="3" width="914" height="184" rx="18" fill="url(#streak-glass)" stroke="url(#streak-border)" stroke-width="1.8" />

  <!-- Title Bar -->
  <g transform="translate(24, 20)">
    <circle cx="0" cy="0" r="4.5" fill="#ff5f56" />
    <circle cx="14" cy="0" r="4.5" fill="#ffbd2e" />
    <circle cx="28" cy="0" r="4.5" fill="#27c93f" />
    <text x="44" y="4" class="streak-title">
      <tspan fill="#ffa657">sam@cyberdeck</tspan>: <tspan fill="#00f0ff">streak-telemetry.sys</tspan> ~ <tspan fill="#39d353">FLAME_ONLINE</tspan>
    </text>

    <!-- Top Right Status Pill -->
    <g transform="translate(692, -8)">
      <rect x="0" y="0" width="160" height="20" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="14" cy="10" r="3" fill="#ffa657">
        <animate attributeName="opacity" values="1; 0.2; 1" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="13.5" font-size="9" fill="#ffa657" font-weight="800" font-family="monospace">
        STREAK: <tspan fill="#39d353">ACTIVE 4d</tspan>
      </text>
    </g>
  </g>

  <!-- Header Separator Line -->
  <line x1="16" y1="36" x2="904" y2="36" stroke="#21262d" stroke-width="1" />

  <!-- ==================== LEFT: TOTAL CONTRIBUTIONS ==================== -->
  <g transform="translate(48, 55)">
    <rect x="0" y="0" width="180" height="110" rx="14" fill="#101722" stroke="#30363d" stroke-width="1" />
    <text x="20" y="28" class="metric-sub">TOTAL CONTRIBUTIONS</text>
    <text x="20" y="70" class="metric-val" fill="#ffffff">143</text>
    <text x="20" y="94" class="metric-date">Jun 21 - Present</text>
  </g>

  <!-- ==================== CENTER: CURRENT STREAK (GLOWING FLAME) ==================== -->
  <g transform="translate(250, 55)">
    <rect x="0" y="0" width="220" height="110" rx="14" fill="#101722" stroke="#ffa657" stroke-width="1.4" stroke-opacity="0.7" />

    <!-- Pulsing Flame Aura -->
    <circle cx="110" cy="52" r="38" fill="url(#flame-aura)" opacity="0.6">
      <animate attributeName="r" values="36; 44; 36" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.45; 0.75; 0.45" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Orbiting Ring -->
    <circle cx="110" cy="52" r="38" fill="none" stroke="#ffa657" stroke-width="2.5" stroke-dasharray="160 40">
      <animateTransform attributeName="transform" type="rotate" from="0 110 52" to="360 110 52" dur="8s" repeatCount="indefinite" />
    </circle>

    <!-- Central Flame Icon -->
    <g transform="translate(110, 38)">
      <text x="0" y="0" font-size="20" text-anchor="middle" filter="url(#flame-bloom)">🔥</text>
    </g>

    <!-- Streak Number -->
    <text x="110" y="68" font-size="34" font-weight="900" fill="#39d353" font-family="monospace" text-anchor="middle">4</text>
    <text x="110" y="86" font-size="10" font-weight="800" fill="#ffa657" font-family="monospace" text-anchor="middle">CURRENT STREAK</text>
    <text x="110" y="100" class="metric-date" text-anchor="middle">Sep 15 - Sep 18</text>
  </g>

  <!-- ==================== RIGHT: LONGEST STREAK ==================== -->
  <g transform="translate(490, 55)">
    <rect x="0" y="0" width="180" height="110" rx="14" fill="#101722" stroke="#30363d" stroke-width="1" />
    <text x="20" y="28" class="metric-sub">LONGEST STREAK</text>
    <text x="20" y="70" class="metric-val" fill="#00f0ff">4</text>
    <text x="20" y="94" class="metric-date">Sep 15 - Sep 18</text>
  </g>

  <!-- ==================== FAR RIGHT: 7-DAY VELOCITY EQUALIZER ==================== -->
  <g transform="translate(692, 55)">
    <rect x="0" y="0" width="180" height="110" rx="14" fill="#101722" stroke="#30363d" stroke-width="1" />
    <text x="14" y="22" font-size="9" font-weight="700" fill="#00f0ff" font-family="monospace">VELOCITY SPECTRUM</text>

    <!-- 7 Equalizer Bars: Mon to Sun -->
    <!-- Bar 1: Mon -->
    <g transform="translate(24, 85)">
      <rect x="0" y="-35" width="12" height="35" rx="3" fill="url(#eq-bar-grad)">
        <animate attributeName="height" values="35; 18; 45; 28; 35" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="y" values="-35; -18; -45; -28; -35" dur="1.8s" repeatCount="indefinite" />
      </rect>
      <text x="6" y="14" class="eq-label">M</text>
    </g>

    <!-- Bar 2: Tue -->
    <g transform="translate(44, 85)">
      <rect x="0" y="-48" width="12" height="48" rx="3" fill="url(#eq-bar-grad)">
        <animate attributeName="height" values="48; 26; 52; 38; 48" dur="2.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="-48; -26; -52; -38; -48" dur="2.1s" repeatCount="indefinite" />
      </rect>
      <text x="6" y="14" class="eq-label">T</text>
    </g>

    <!-- Bar 3: Wed -->
    <g transform="translate(64, 85)">
      <rect x="0" y="-28" width="12" height="28" rx="3" fill="url(#eq-bar-grad)">
        <animate attributeName="height" values="28; 50; 22; 42; 28" dur="1.7s" repeatCount="indefinite" />
        <animate attributeName="y" values="-28; -50; -22; -42; -28" dur="1.7s" repeatCount="indefinite" />
      </rect>
      <text x="6" y="14" class="eq-label">W</text>
    </g>

    <!-- Bar 4: Thu -->
    <g transform="translate(84, 85)">
      <rect x="0" y="-42" width="12" height="42" rx="3" fill="url(#eq-bar-grad)">
        <animate attributeName="height" values="42; 20; 48; 32; 42" dur="2.3s" repeatCount="indefinite" />
        <animate attributeName="y" values="-42; -20; -48; -32; -42" dur="2.3s" repeatCount="indefinite" />
      </rect>
      <text x="6" y="14" class="eq-label">T</text>
    </g>

    <!-- Bar 5: Fri -->
    <g transform="translate(104, 85)">
      <rect x="0" y="-54" width="12" height="54" rx="3" fill="url(#eq-bar-grad)">
        <animate attributeName="height" values="54; 30; 58; 40; 54" dur="1.9s" repeatCount="indefinite" />
        <animate attributeName="y" values="-54; -30; -58; -40; -54" dur="1.9s" repeatCount="indefinite" />
      </rect>
      <text x="6" y="14" class="eq-label" fill="#39d353">F</text>
    </g>

    <!-- Bar 6: Sat -->
    <g transform="translate(124, 85)">
      <rect x="0" y="-22" width="12" height="22" rx="3" fill="url(#eq-bar-grad)">
        <animate attributeName="height" values="22; 38; 18; 30; 22" dur="2.4s" repeatCount="indefinite" />
        <animate attributeName="y" values="-22; -38; -18; -30; -22" dur="2.4s" repeatCount="indefinite" />
      </rect>
      <text x="6" y="14" class="eq-label">S</text>
    </g>

    <!-- Bar 7: Sun -->
    <g transform="translate(144, 85)">
      <rect x="0" y="-32" width="12" height="32" rx="3" fill="url(#eq-bar-grad)">
        <animate attributeName="height" values="32; 16; 40; 24; 32" dur="2.0s" repeatCount="indefinite" />
        <animate attributeName="y" values="-32; -16; -40; -24; -32" dur="2.0s" repeatCount="indefinite" />
      </rect>
      <text x="6" y="14" class="eq-label">S</text>
    </g>
  </g>
</svg>