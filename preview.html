<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyberpunk GitHub Profile Preview</title>
  <style>
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 30px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    table {
      border-collapse: collapse;
      margin: 0 auto;
      width: 100%;
    }
    td {
      padding: 8px;
    }
    img {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <table border="0" cellpadding="0" cellspacing="0">
      <tr>
        <td width="50%" align="center" valign="top">
          <img src="terminal-card.svg" alt="Terminal Card" width="100%" />
        </td>
        <td width="50%" align="center" valign="top">
          <img src="info-card.svg" alt="Info Card" width="100%" />
        </td>
      </tr>
    </table>

    <div style="margin-top: 24px; text-align: center;">
      <img src="github-contribution-animation.svg" alt="Contribution Graph" width="100%" />
    </div>
  </div>
</body>
</html>
