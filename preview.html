<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyberpunk GitHub Profile Preview</title>
  <style>
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 30px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    table {
      border-collapse: collapse;
      margin: 0 auto;
      width: 100%;
    }
    td {
      padding: 8px;
    }
    img {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 920px; margin: 0 auto;">
    <!-- Hero Banner -->
    <div style="margin-bottom: 20px;">
      <img src="header-liquid-glass.svg" alt="Header" width="100%" />
    </div>

    <!-- Unified Dual-Pane Terminal Card -->
    <div style="margin-bottom: 20px;">
      <img src="terminal-card.svg" alt="Cyberdeck Terminal" width="100%" />
    </div>

    <!-- Autonomous Snake Game -->
    <div style="margin-bottom: 20px;">
      <img src="github-contribution-grid-snake.svg" alt="Snake" width="100%" />
    </div>

    <!-- Stats Matrix -->
    <div style="margin-bottom: 20px;">
      <img src="github-stats-animated.svg" alt="Stats" width="100%" />
    </div>

    <!-- CyberDeck Live Streak & Velocity Equalizer -->
    <div style="margin-bottom: 20px;">
      <img src="github-streak-cyberdeck.svg" alt="Streak" width="100%" />
    </div>

    <!-- Projects Dashboard -->
    <div style="margin-bottom: 20px;">
      <img src="projects-animated.svg" alt="Projects" width="100%" />
    </div>
  </div>
</body>
</html>
