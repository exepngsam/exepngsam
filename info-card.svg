<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 425 475" width="100%" height="auto" style="max-width: 425px; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="info-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#121820" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="info-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Swatch Drop Shadow -->
    <filter id="swatch-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .term-title { font-size: 11px; fill: #7d8590; font-weight: 600; }
    .hdr-user { font-size: 13px; font-weight: 800; fill: #00f0ff; letter-spacing: 0.5px; }
    .hdr-host { font-size: 13px; font-weight: 800; fill: #39d353; letter-spacing: 0.5px; }
    .divider-line { font-size: 10px; fill: #30363d; }
    .sec-label { font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; }
    .f-key { font-size: 11px; font-weight: 700; }
    .f-sep { font-size: 11px; fill: #7d8590; font-weight: 400; }
    .f-val { font-size: 11px; font-weight: 500; }
  </style>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="421" height="471" rx="12" fill="url(#info-bg)" stroke="url(#info-border)" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <g transform="translate(18, 16)">
    <!-- macOS buttons -->
    <circle cx="0" cy="5" r="4.5" fill="#ff5f56" />
    <circle cx="14" cy="5" r="4.5" fill="#ffbd2e" />
    <circle cx="28" cy="5" r="4.5" fill="#27c93f" />

    <!-- Window Title -->
    <text x="44" y="8.5" class="term-title">
      <tspan fill="#00f0ff">sam</tspan>@<tspan fill="#39d353">cyberdeck</tspan>: <tspan fill="#e6edf3">~/neofetch</tspan>
    </text>

    <!-- Right status pill -->
    <rect x="303" y="-1" width="80" height="15" rx="7.5" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
    <text x="315" y="10" font-size="8.5" fill="#39d353" font-weight="700">SYS.ONLINE</text>
  </g>

  <!-- Header Separator -->
  <line x1="14" y1="42" x2="411" y2="42" stroke="#21262d" stroke-width="1" />

  <!-- Neofetch Content: Staggered Line Reveals -->
  <g id="neofetch-lines">

    <!-- Line 1: Header -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="0.250s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="0.250s" fill="freeze" />
      <text x="24" y="66">
        <tspan class="hdr-user">sam</tspan><tspan fill="#e6edf3">@</tspan><tspan class="hdr-host">cyberdeck</tspan>
      </text>
    </g>
    <!-- Line 2: Divider -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="0.310s" fill="freeze" />
      <text x="24" y="82.5" class="divider-line">---------------------------------------------</text>
    </g>
    <!-- Line 3: OS -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="0.370s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="0.370s" fill="freeze" />
      <text x="24" y="99.0">
        <tspan class="f-key" fill="#58a6ff">OS</tspan>
        <tspan class="f-sep"> ~ </tspan>
        <tspan class="f-val" fill="#e6edf3">CyberDeck OS x86_64 [Linux Kernel 6.12]</tspan>
      </text>
    </g>
    <!-- Line 4: Host -->
