      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="1.090s" fill="freeze" />
      <text x="28" y="363.2000000000001">
        <tspan class="f-key" fill="#bc8cff">YieldWay</tspan>
        <tspan class="f-sep"> ~ </tspan>
