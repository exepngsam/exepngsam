      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="0.910s" fill="freeze" />
      <text x="24" y="259.5">
        <tspan class="f-key" fill="#bc8cff">Nexora</tspan>
