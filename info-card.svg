      <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="1.270s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="1.270s" fill="freeze" />
      <text x="28" y="428.60000000000014">
        <tspan class="f-key" fill="#00f0ff">Contributions</tspan>
        <tspan class="f-sep"> ~ </tspan>
