      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="1.030s" fill="freeze" />
      <text x="28" y="343.4000000000001">
        <tspan class="f-key" fill="#bc8cff">TruthSeal</tspan>
        <tspan class="f-sep"> ~ </tspan>
