      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="0.550s" fill="freeze" />
      <text x="28" y="173.00000000000003">
        <tspan class="f-key" fill="#58a6ff">Location</tspan>
        <tspan class="f-sep"> ~ </tspan>
        <tspan class="f-val" fill="#e6edf3">Cyberspace / Dev Hub</tspan>
      </text>
    </g>
    <!-- Line 7: Section -->
