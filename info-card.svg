    <rect x="0" y="0" width="14" height="14" rx="3" fill="#161b22" opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="1.490s" fill="freeze" />
      <animateTransform attributeName="transform" type="scale" values="0.3; 1.1; 1" keyTimes="0; 0.7; 1" dur="0.25s" begin="1.490s" fill="freeze" />
    </rect>
    <rect x="20" y="0" width="14" height="14" rx="3" fill="#ff5f56" opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="1.530s" fill="freeze" />
      <animateTransform attributeName="transform" type="scale" values="0.3; 1.1; 1" keyTimes="0; 0.7; 1" dur="0.25s" begin="1.530s" fill="freeze" />
