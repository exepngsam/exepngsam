      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="0.430s" fill="freeze" />
      <text x="24" y="115.5">
        <tspan class="f-key" fill="#58a6ff">Host</tspan>
        <tspan class="f-sep"> ~ </tspan>
        <tspan class="f-val" fill="#e6edf3">AWS Cloud / Serverless Edge Engine</tspan>
      </text>
    </g>
    <!-- Line 5: Role -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="0.490s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="0.490s" fill="freeze" />
      <text x="24" y="132.0">
        <tspan class="f-key" fill="#ffa657">Role</tspan>
        <tspan class="f-sep"> ~ </tspan>
        <tspan class="f-val" fill="#00f0ff">AI Systems &amp; Full-Stack Architect</tspan>
      </text>
    </g>
    <!-- Line 6: Location -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="0.550s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="0.550s" fill="freeze" />
      <text x="24" y="148.5">
        <tspan class="f-key" fill="#58a6ff">Location</tspan>
        <tspan class="f-sep"> ~ </tspan>
        <tspan class="f-val" fill="#e6edf3">Cyberspace / Dev Hub</tspan>
      </text>
    </g>
    <!-- Line 7: Section -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="0.610s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="0.610s" fill="freeze" />
      <text x="24" y="171.0" class="sec-label" fill="#ffa657">━━━ CORE STACK ━━━━━━━━━━━━━━━━━━━━━━━━━</text>
    </g>
    <!-- Line 8: Languages -->
