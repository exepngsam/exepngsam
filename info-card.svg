      <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="0.670s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="0.670s" fill="freeze" />
      <text x="24" y="187.5">
        <tspan class="f-key" fill="#39d353">Languages</tspan>
        <tspan class="f-sep"> ~ </tspan>
        <tspan class="f-val" fill="#e6edf3">TypeScript, Python, JavaScript, SQL</tspan>
      </text>
    </g>
    <!-- Line 9: Frameworks -->
