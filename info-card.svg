    <rect x="60" y="0" width="14" height="14" rx="3" fill="#ffbd2e" opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="1.610s" fill="freeze" />
      <animateTransform attributeName="transform" type="scale" values="0.3; 1.1; 1" keyTimes="0; 0.7; 1" dur="0.25s" begin="1.610s" fill="freeze" />
    </rect>
    <rect x="80" y="0" width="14" height="14" rx="3" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="1.650s" fill="freeze" />
      <animateTransform attributeName="transform" type="scale" values="0.3; 1.1; 1" keyTimes="0; 0.7; 1" dur="0.25s" begin="1.650s" fill="freeze" />
    </rect>
    <rect x="100" y="0" width="14" height="14" rx="3" fill="#bc8cff" opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.2s" begin="1.690s" fill="freeze" />
      <animateTransform attributeName="transform" type="scale" values="0.3; 1.1; 1" keyTimes="0; 0.7; 1" dur="0.25s" begin="1.690s" fill="freeze" />
