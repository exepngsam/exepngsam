      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="0.790s" fill="freeze" />
      <text x="28" y="258.20000000000005">
        <tspan class="f-key" fill="#39d353">Cloud &amp; AI</tspan>
        <tspan class="f-sep"> ~ </tspan>
        <tspan class="f-val" fill="#e6edf3">AWS Bedrock, GenAI, CDK, Serverless, Docker</tspan>
