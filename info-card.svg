      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="1.090s" fill="freeze" />
      <text x="24" y="309.0">
        <tspan class="f-key" fill="#bc8cff">YieldWay</tspan>
        <tspan class="f-sep"> ~ </tspan>
        <tspan class="f-val" fill="#00f0ff">Bedrock AgriTech Logistics Engine</tspan>
      </text>
    </g>
    <!-- Line 16: Portfolio -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="1.150s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="1.150s" fill="freeze" />
      <text x="24" y="325.5">
        <tspan class="f-key" fill="#bc8cff">Portfolio</tspan>
        <tspan class="f-sep"> ~ </tspan>
        <tspan class="f-val" fill="#00f0ff">3D Particle Physics Engine Terminal OS</tspan>
      </text>
    </g>
    <!-- Line 17: Section -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="1.210s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="1.210s" fill="freeze" />
      <text x="24" y="348.0" class="sec-label" fill="#00f0ff">━━━ TELEMETRY ━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
    </g>
    <!-- Line 18: Contributions -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="1.270s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="1.270s" fill="freeze" />
      <text x="24" y="364.5">
        <tspan class="f-key" fill="#00f0ff">Contributions</tspan>
        <tspan class="f-sep"> ~ </tspan>
        <tspan class="f-val" fill="#39d353">109 Commits in 2026 (Active)</tspan>
      </text>
    </g>
    <!-- Line 19: Architecture -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="1.330s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="1.330s" fill="freeze" />
      <text x="24" y="381.0">
