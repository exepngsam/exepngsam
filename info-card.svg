    </g>
    <!-- Line 16: Portfolio -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="1.150s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="1.150s" fill="freeze" />
      <text x="28" y="383.0000000000001">
        <tspan class="f-key" fill="#bc8cff">Portfolio</tspan>
        <tspan class="f-sep"> ~ </tspan>
        <tspan class="f-val" fill="#00f0ff">3D Particle Physics Engine Terminal OS</tspan>
      </text>
    </g>
    <!-- Line 17: Section -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="1.210s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 0" dur="0.22s" begin="1.210s" fill="freeze" />
      <text x="28" y="408.8000000000001" class="sec-label" fill="#00f0ff">━━━ TELEMETRY ━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
    </g>
